[project]
name = "worldengine"
version = "0.1.0"
description = "A multi-agent world simulation engine for generative storytelling"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.10",
    "openai>=2.53.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
world-engine = "world_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["world_engine"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp"
